name: Deploy Chess Vision

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chess-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, chess-deploy]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --tag chess-vision:local .

      - name: Deploy via SSH
        shell: bash
        env:
          SSH_USER: ${{ vars.CHESS_SSH_USER }}
          SSH_KEY: ${{ secrets.CHESS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CHESS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_USER:?Set CHESS_SSH_USER}" "${SSH_KEY:?Set CHESS_SSH_KEY}" "${SSH_KNOWN_HOSTS:?Set CHESS_SSH_KNOWN_HOSTS}"
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh_options=(-i "$ssh_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts"
            -o ConnectTimeout=15 -o User="$SSH_USER")
          host=storage.netbird.cloud

          docker save chess-vision:local | gzip | ssh "${ssh_options[@]}" "$host" 'docker load'
          ssh "${ssh_options[@]}" "$host" 'cd /data/chess && cat > compose.yaml.new && mv compose.yaml.new compose.yaml && docker compose up -d --wait --wait-timeout 60' < compose.yaml
